name: Deploy Dashboard to Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to deploy
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

jobs:
  deploy:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel secrets
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Pull Vercel environment
        run: npx --yes vercel pull --yes --environment="${{ inputs.environment }}" --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        run: |
          PROD_FLAG=""
          if [ "${{ inputs.environment }}" = "production" ]; then
            PROD_FLAG="--prod"
          fi
          npx --yes vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        run: |
          PROD_FLAG=""
          if [ "${{ inputs.environment }}" = "production" ]; then
            PROD_FLAG="--prod"
          fi
          npx --yes vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN"
